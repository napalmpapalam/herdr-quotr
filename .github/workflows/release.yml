name: release

# Build a prebuilt binary for each supported platform and attach it to the GitHub Release
# whenever a v* tag is pushed. herdr/install.sh downloads the matching asset on plugin install.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Sigstore-signed build provenance for every release asset, verifiable by anyone via
  # `gh attestation verify <asset> --repo napalmpapalam/herdr-quotr`.
  id-token: write
  attestations: write

jobs:
  # A tag push creates no Release object on its own, and the upload action below uploads to an
  # existing release — so create it first (idempotent), and have the matrix depend on it. Draft
  # until the binaries attach, so a half-built release never installs a 404.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The release body is the tag's CHANGELOG.md section; a missing section fails the release
      # rather than shipping a bare compare link.
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          title: herdr-quotr $version
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v5

      # Builds herdr-quotr for the target (cross-compiling aarch64 Linux via `cross` as needed),
      # archives it as herdr-quotr-<target>.tar.gz with a .sha256 sidecar, and uploads both.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: herdr-quotr
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: herdr-quotr-${{ matrix.target }}.tar.gz

  # Publish once every target's assets are attached. A failed target leaves the draft for
  # inspection instead of shipping a release that installs 404.
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
