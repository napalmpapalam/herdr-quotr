name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref makes the running checks moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds each commit once from cold; incremental artifacts only bloat the cache.
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

# Every check runs concurrently, so wall-clock is the slowest one rather than their sum.
# `Swatinem/rust-cache` keys the registry and `target/` on Cargo.lock *and* the job, so the
# jobs never race to write one cache entry and each stays warm across runs.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # No cache: `cargo fmt` never invokes rustc, so there is nothing to reuse.
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  # The workspace denies broken intra-doc links; only a doc build enforces it.
  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  # `rust-version` in Cargo.toml is a promise to anyone building from source; with no pinned
  # toolchain, only a build on that exact version keeps it honest.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  # The release binary is what herdr actually runs, and `strip`/`lto` only apply here.
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck herdr/*.sh
