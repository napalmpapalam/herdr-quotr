version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # `dtolnay/rust-toolchain@<version>` names the toolchain, not the action's release, so
      # the msrv job's ref is the `rust-version` in Cargo.toml. Bumping it defeats the check.
      - dependency-name: dtolnay/rust-toolchain
