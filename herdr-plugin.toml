id = "napalmpapalam.quotr"
name = "quotr"
version = "0.1.1"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]
description = "Quote an agent's own response back at it, from a herdr popup."

# On `herdr plugin install`, download the prebuilt `herdr-quotr` binary for this platform from
# the matching GitHub Release into $HERDR_PLUGIN_ROOT/bin (no Rust toolchain needed). Skipped by
# `herdr plugin link` — for a local checkout, build it yourself with
# `cargo build --release && install -m 0755 target/release/herdr-quotr bin/herdr-quotr`.
[[build]]
command = ["bash", "herdr/install.sh"]

# The picker runs the binary by absolute path under the plugin root: the pane's cwd is the
# agent's repo, not the plugin root, and the binary isn't on PATH.
[[panes]]
id = "picker"
title = "quotr"
placement = "popup"
# Without these herdr picks its own popup box; the picker wants the whole terminal.
# Percent-of-terminal or cell counts, popup placement only.
width = "100%"
height = "100%"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-quotr\""]

[[actions]]
id = "open"
title = "quotr: quote the agent's answer"
contexts = ["pane"]
command = ["bash", "herdr/open.sh"]
