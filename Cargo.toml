[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["Semen Loktionov <loktionov.kh@gmail.com>"]
license = "MIT"
repository = "https://github.com/napalmpapalam/herdr-quotr"

[workspace.dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
# Dropped from ratatui's defaults: `all-widgets` (calendar only), `macros`, and
# `underline-color`. `layout-cache` stays — the picker re-solves its layout every frame.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# Dumps + fancy-regex only: no yaml-load (the syntax set is a prebuilt binary dump, so the
# unmaintained yaml-rust never enters the tree), no onig (pure-Rust regex engine).
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load", "plist-load"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
# `cjk` is a default, kept deliberately: transcripts carry wide glyphs and the wrap is
# width-aware.
unicode-width = { version = "0.2", default-features = false, features = ["cjk"] }
export = { path = "crates/export" }
herdr = { path = "crates/herdr" }
transcript = { path = "crates/transcript" }
ui = { path = "crates/ui" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
wildcard_imports = "deny"
# Pragmatic allows for an application binary (vs a public library):
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# The binary: terminal lifecycle and the event loop. All logic lives in `crates/*`.
[package]
name = "herdr-quotr"
description = "Quote an agent's own response back at it, from a herdr popup."
readme = "README.md"
keywords = ["herdr", "tui", "agent", "claude", "quote"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
ratatui.workspace = true
export.workspace = true
herdr.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
transcript.workspace = true
ui.workspace = true

[lints]
workspace = true

[profile.release]
strip = true
lto = "thin"
